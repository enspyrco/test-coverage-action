# action.yml
name: 'Test Coverage'
description: 'Calculate test coverage and generate html'
inputs:
  repo_token:
    description: "The GITHUB_TOKEN secret"
    required: false
  service_account_key:
    description: "Service account key - JSON encoded as a String"
    required: true
  package_name:
    description: "If used in a multi-package monorepo, the name of the package to test"
    required: false
  packages_path:
    description: "The path to the packages folder (in a multi-package repo)"
    required: false
  site_id:
    description: "The id of the hosting site to deploy to. If not included, the action will attempt to read from the repo's .firebaserc."
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
